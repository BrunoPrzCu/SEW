<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <title>Altimetría - Ruta Gastronómica de San Martín</title>
  <!-- Rejilla de fondo -->
  <g stroke="#dddddd" stroke-width="1">
    <line x1="50" y1="50.0" x2="750" y2="50.0" />
    <text x="45" y="50.0" text-anchor="end" alignment-baseline="middle" font-size="12">300m</text>
    <line x1="50" y1="110.0" x2="750" y2="110.0" />
    <text x="45" y="110.0" text-anchor="end" alignment-baseline="middle" font-size="12">290m</text>
    <line x1="50" y1="170.0" x2="750" y2="170.0" />
    <text x="45" y="170.0" text-anchor="end" alignment-baseline="middle" font-size="12">280m</text>
    <line x1="50" y1="230.0" x2="750" y2="230.0" />
    <text x="45" y="230.0" text-anchor="end" alignment-baseline="middle" font-size="12">270m</text>
    <line x1="50" y1="290.0" x2="750" y2="290.0" />
    <text x="45" y="290.0" text-anchor="end" alignment-baseline="middle" font-size="12">260m</text>
    <line x1="50" y1="350.0" x2="750" y2="350.0" />
