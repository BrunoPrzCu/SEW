    <line x1="50.0" y1="50" x2="50.0" y2="350" />
    <text x="50.0" y="365" text-anchor="middle" font-size="12">0km</text>
    <line x1="250.0" y1="50" x2="250.0" y2="350" />
    <text x="250.0" y="365" text-anchor="middle" font-size="12">1km</text>
    <line x1="450.0" y1="50" x2="450.0" y2="350" />
    <text x="450.0" y="365" text-anchor="middle" font-size="12">2km</text>
    <line x1="650.0" y1="50" x2="650.0" y2="350" />
    <text x="650.0" y="365" text-anchor="middle" font-size="12">3km</text>
  </g>
  <!-- Línea de altimetría -->
  <polyline points="50.0,212.0 110.0,206.0 210.00000000000003,194.0 350.0,181.99999999999997 510.0,200.0 750.0,218.0 " fill="none" stroke="#0066cc" stroke-width="3" />
  <!-- Puntos de interés -->
  <circle cx="50.0" cy="212.0" r="5" fill="#ff3333" />
  <text x="50.0" y="202.0" text-anchor="middle" font-size="12">Inicio</text>
  <circle cx="110.0" cy="206.0" r="5" fill="#ff3333" />
  <text x="110.0" y="196.0" text-anchor="middle" font-size="12">Hito 1</text>
  <circle cx="210.00000000000003" cy="194.0" r="5" fill="#ff3333" />
  <text x="210.00000000000003" y="184.0" text-anchor="middle" font-size="12">Hito 2</text>
  <circle cx="350.0" cy="181.99999999999997" r="5" fill="#ff3333" />
  <text x="350.0" y="171.99999999999997" text-anchor="middle" font-size="12">Hito 3</text>
  <circle cx="510.0" cy="200.0" r="5" fill="#ff3333" />
  <text x="510.0" y="190.0" text-anchor="middle" font-size="12">Hito 4</text>
  <circle cx="750.0" cy="218.0" r="5" fill="#ff3333" />
  <text x="750.0" y="208.0" text-anchor="middle" font-size="12">Hito 5</text>
  <text x="400.0" y="25.0" text-anchor="middle" font-size="18" font-weight="bold">Perfil de Altimetría - Ruta Gastronómica de San Martín</text>
