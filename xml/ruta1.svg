  <text x="281.77777777777777" y="110.55555555555556" text-anchor="middle" font-family="Arial" font-size="7" fill="#4db6e5">295m</text>
  <line x1="360.0" y1="104.22222222222221" x2="360.0" y2="210" stroke="#4db6e5" stroke-width="0.5" stroke-dasharray="2,2" />
